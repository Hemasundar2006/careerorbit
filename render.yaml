services:
  - type: web
    runtime: node
    name: careerorbit
    buildCommand: npm install
    startCommand: npm run start:api
    initialDeployHook: npm run admin:setup
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
